name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Qt ${{ matrix.qt }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: 6
            packages: qt6-base-dev qt6-serialport-dev libqt6opengl6-dev libgl-dev
          - qt: 5
            packages: qtbase5-dev libqt5serialport5-dev libgl-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.packages }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQTSM_QT_MAJOR=${{ matrix.qt }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (Qt 6)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          modules: qtserialport qtgraphs qtquick3d qtshadertools
          cache: true

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/QtSerialMonitor.exe dist/
          windeployqt --release --no-translations --no-opengl-sw --qmldir src/qml dist/QtSerialMonitor.exe

      - uses: actions/upload-artifact@v4
        with:
          name: QtSerialMonitor-windows-x64
          path: dist/

  macos:
    name: macOS (Qt 6)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: qtserialport qtgraphs qtquick3d qtshadertools
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: macdeployqt build/QtSerialMonitor.app -qmldir=src/qml -dmg

      - uses: actions/upload-artifact@v4
        with:
          name: QtSerialMonitor-macos
          path: build/QtSerialMonitor.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Windows build
        run: cd artifacts && zip -r "../QtSerialMonitor-${GITHUB_REF_NAME}-windows-x64.zip" QtSerialMonitor-windows-x64

      - name: Rename macOS image
        run: mv artifacts/QtSerialMonitor-macos/QtSerialMonitor.dmg "QtSerialMonitor-${GITHUB_REF_NAME}-macos.dmg"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            QtSerialMonitor-*-windows-x64.zip
            QtSerialMonitor-*-macos.dmg
